services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_prepared_transactions=10"]
    environment:
      POSTGRES_DB: Bancoari
      POSTGRES_USER: d
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d -d Bancoari"]
      interval: 2s
      timeout: 3s
      retries: 30